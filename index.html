<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatório do Futuro Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Observatório do Futuro Sustentável</h1>
        <p>Monitorando o equilíbrio entre agricultura e meio ambiente</p>
    </header>

    <main>
        <section class="panel-container">
            <div class="panel" id="uso-solo">
                <h2>Uso do Solo</h2>
                <canvas id="chartUsoSolo"></canvas>
            </div>
            <div class="panel" id="conservacao-florestas">
                <h2>Conservação de Florestas</h2>
                <canvas id="chartFlorestas"></canvas>
            </div>
            <div class="panel" id="producao-agricola">
                <h2>Produção Agrícola</h2>
                <canvas id="chartProducao"></canvas>
            </div>
            <div class="panel" id="recursos-hidricos">
                <h2>Recursos Hídricos</h2>
                <canvas id="chartAgua"></canvas>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Observatório do Futuro Sustentável</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
